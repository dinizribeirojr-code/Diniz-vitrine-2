<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Genesis AI</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .not-found{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    gap: 18px;
  }
  .not-found .eyebrow{ margin: 0 0 6px; }
  .not-found h1{ font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .not-found p{ color: var(--muted); max-width: 40ch; }
</style>
</head>
<body>
  <div class="not-found">
    <span class="eyebrow">Erro 404</span>
    <h1>Essa página não existe.</h1>
    <p>O endereço que você tentou acessar não foi encontrado. Volte para a página inicial da Genesis AI.</p>
    <a class="btn btn-primary" href="/">Voltar para o início</a>
  </div>
</body>
</html>
